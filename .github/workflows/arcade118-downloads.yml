name: Verify Arcade 118 public downloads
on:
  push:
    branches: [arcade-118-ring-build]
    paths: ['.github/workflows/arcade118-downloads.yml']
permissions: {}
jobs:
  verify:
    if: github.repository == '7y8yfpf64t-oss/kaunertal-medien' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check pinned raw fallback and the released GitHub Pages bytes
        shell: python
        run: |
          import hashlib, time, urllib.request
          path='map-packs/fight_club_ringroom.179da0608870dae0.pck'
          origin='https://raw.githubusercontent.com/7y8yfpf64t-oss/kaunertal-medien/b3fd078f25c929d792eee54bb4693879f41b8421/'
          pages='https://7y8yfpf64t-oss.github.io/kaunertal-medien/'
          for base in (origin,pages):
              for attempt in range(55):
                  try:
                      url=base+path
                      probe=url if attempt==0 else url+'?verify=118-'+str(attempt)
                      with urllib.request.urlopen(probe,timeout=15) as r:
                          data=r.read()
                          status=r.status
                      h=hashlib.sha256(data).hexdigest()
                      assert status==200 and len(data)==8029880 and h=='179da0608870dae09e5732129379d1b0d916a6eb807608951ff39e94aba000fe',(status,len(data),h)
                      print('VERIFIED',url,status,len(data),h,flush=True)
                      break
                  except Exception as err:
                      print(str(err),flush=True)
                      if attempt==54: raise
                      time.sleep(8)
